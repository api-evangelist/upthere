name: Upthere
description: >-
  Upthere was a consumer cloud-storage company backed by GV and founded by
  former Apple software engineering chief Bertrand Serlet. Its Upthere Home app
  was designed as "one home" for photos, videos, music, and documents, stored
  directly in the Upthere cloud with fast search, private sharing, and shared
  "Loops". Western Digital acquired Upthere in 2017 and later discontinued the
  service; upthere.com now 302-redirects every path to a retired Western
  Digital support notice. Upthere never published a public developer API, and
  no API surface remains — this profile records the company identity and the
  posture of the surviving domain.
